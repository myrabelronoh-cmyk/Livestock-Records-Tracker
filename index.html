<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestock Tracker - Dark Farm Edition</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-layout">
  <!-- SIDEBAR - No Health -->
  <aside class="sidebar">
    <h2>Livestock Tracker</h2>
    <nav>
      <button class="nav-btn active">Dashboard</button>
      <button class="nav-btn">Animals</button>
    </nav>
    <p class="version">v1.0 - Dark Farm Edition</p>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <section class="add-section">
      <h3>Add Animal</h3>
      <div class="form-row">
        <div class="form-group"><label>Name</label><input id="name" placeholder="Daisy"></div>
        <div class="form-group"><label>Breed</label><input id="breed" placeholder="Friesian"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Age</label><input id="age" type="number" placeholder="3"></div>
        <div class="form-group"><label>Type</label>
          <select id="type"><option>Cow</option><option>Goat</option><option>Sheep</option></select>
        </div>
      </div>
      <button id="submit-btn">Add Animal</button>
      <p id="feedback-message" class="hidden"></p>
    </section>

    <section class="records-section">
      <h3>All Records</h3>
      <div id="livestock-list"></div>
    </section>
  </main>

  <!-- DASHBOARD - Only Total, Avg Age, Last Added - NO Sick, NO Quarantine -->
  <aside class="dashboard">
    <h3>Dashboard</h3>
    <div class="stats">
      <div class="stat"><span>Total</span><strong id="total-count">0</strong></div>
      <div class="stat"><span>Avg Age</span><strong id="avg-age">0</strong></div>
    </div>
    <div class="last-added-box">
      <span>Last Added</span>
      <strong id="last-added">None</strong>
    </div>
  </aside>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
