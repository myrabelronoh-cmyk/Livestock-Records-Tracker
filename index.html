<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestock Tracker</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h3 style="color:#7ed957">Livestock Tracker</h3>
    <div class="nav active">Dashboard</div>
    <div class="nav">Animals</div>
  </aside>

  <main class="center">
    <section class="card">
      <h4>Add Animal</h4>
      <div class="grid2">
        <div><label>Name</label><input id="name" placeholder="Daisy"></div>
        <div><label>Breed</label><input id="breed" placeholder="Friesian"></div>
      </div>
      <div class="grid2">
        <div><label>Age</label><input id="age" type="number" placeholder="3"></div>
        <div><label>Type</label><select id="type"><option>Cow</option><option>Goat</option><option>Sheep</option></select></div>
      </div>
      <button id="submit-btn">Add Animal</button>
      <p id="feedback-message" class="hidden"></p>
    </section>

    <section class="card">
      <h4>All Records</h4>
      <div id="livestock-list"></div>
    </section>
  </main>

  <aside class="right">
    <h4>Dashboard</h4>
    <div class="dash-grid">
      <div class="dash-box"><small>Total</small><b id="total-count">0</b></div>
      <div class="dash-box"><small>Avg Age</small><b id="avg-age">0</b></div>
    </div>
    <div class="dash-box" style="margin-top:12px;text-align:center"><small>Last Added</small><b id="last-added">None</b></div>
  </aside>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
