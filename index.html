<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestock Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>🐄 Livestock<br>Tracker</h2>
    <nav>
      <a class="active">📊 Dashboard</a>
      <a>🐄 Animals</a>
      <a>⚙️ Settings</a>
    </nav>
  </aside>
  <main class="main">
    <div class="card">
      <h3>Add Animal</h3>
      <div class="form-grid">
        <input id="name" placeholder="Name eg Daisy">
        <input id="breed" placeholder="Breed eg Friesian">
        <input id="age" type="number" placeholder="Age">
        <select id="type"><option>Cow</option><option>Goat</option><option>Sheep</option></select>
      </div>
      <button id="addBtn">Add Animal</button>
    </div>
    <div class="card">
      <h3>All Records</h3>
      <div id="records" class="records-grid"></div>
    </div>
  </main>
  <aside class="dash">
    <div class="card"><h4>Dashboard</h4>
      <div class="stat"><span>Total Animals</span><b id="total">0</b></div>
      <div class="stat"><span>Average Age</span><b id="avg">0</b></div>
      <div class="stat"><span>Last Added</span><b id="last">None</b></div>
    </div>
  </aside>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
