<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livestock Tracker - Dark Farm</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">Livestock Tracker</h2>
      <nav>
        <button class="nav-btn active">Dashboard</button>
        <button class="nav-btn">Animals</button>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="card">
        <h3>Add Animal</h3>
        <form id="animalForm">
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="name" placeholder="Daisy" required />
            </div>
            <div class="form-group">
              <label>Breed</label>
              <input type="text" id="breed" placeholder="Friesian" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Age</label>
              <input type="number" id="age" placeholder="3" required />
            </div>
            <div class="form-group">
              <label>Type</label>
              <select id="type">
                <option value="Cow">Cow</option>
                <option value="Goat">Goat</option>
                <option value="Sheep">Sheep</option>
                <option value="Chicken">Chicken</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-add">Add Animal</button>
        </form>
      </div>

      <div class="card">
        <h3>All Records</h3>
        <div id="records" class="records-grid"></div>
      </div>
    </main>

    <!-- Right Dashboard -->
    <aside class="dashboard">
      <h3>Dashboard</h3>
      <div class="stats">
        <div class="stat">
          <span>Total</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat">
          <span>Avg Age</span>
          <strong id="avgAge">0</strong>
        </div>
      </div>
      <div class="last-added">
        <span>Last Added</span>
        <strong id="lastAdded">None</strong>
      </div>
    </aside>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
